# AutoFlow V2 — NAS Docker Compose 部署
# 实验性版本，与主版本 autoflow 隔离运行
# 端口：主版本 8000，V2 使用 8002 避免冲突

services:
  autoflow-v2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoflow-v2
    restart: unless-stopped
    ports:
      - "8002:8000"  # MCP + WebUI（实验版，与主版 8000 隔离）
    environment:
      - AUTOFLLOW_ENV=staging
      - HASS_SERVER=http://192.168.2.200:8123
      - HASS_TOKEN=${HASS_TOKEN}
      - NR_URL=http://192.168.2.200:1880
      - NR_USER=${NR_USER}
      - NR_PASS=${NR_PASS}
      - AF_MCP_HOST=0.0.0.0
      - AF_MCP_PORT=8000
      - AF_MCP_PATH=/mcp
      - AF_AUTO_APPROVE=false
      - TZ=Asia/Shanghai
    volumes:
      - ./src:/app/src:ro           # 源码绑定挂载（只读，改代码后 restart 生效）
      - ./data:/data                # 持久化数据（授权码、API Key、Token 统计等）
      - ./skills:/app/skills:ro     # skills 绑定挂载
    networks:
      - autoflow-v2-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/core/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  autoflow-v2-net:
    driver: bridge
