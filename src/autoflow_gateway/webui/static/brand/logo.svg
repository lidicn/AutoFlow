<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="AutoFlow">
  <defs>
    <linearGradient id="afShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#2F6BFF"/>
    </linearGradient>
  </defs>
  <!-- 盾形：守护自动化流程的安全闸 -->
  <path d="M128 18 L222 54 V128 C222 184 178 220 128 240 C78 220 34 184 34 128 V54 Z"
        fill="url(#afShield)"/>
  <!-- 内部流动箭头：从一个节点流出、向上向右推进 = 自动化流程 -->
  <g fill="none" stroke="#ffffff" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
    <path d="M84 176 C 86 132 166 150 172 88"/>
    <path d="M150 102 L172 86 L194 70"/>
  </g>
  <circle cx="84" cy="176" r="13" fill="#ffffff"/>
</svg>
