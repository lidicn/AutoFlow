<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B8CFF"/>
      <stop offset="100%" stop-color="#2F6BFF"/>
    </linearGradient>
  </defs>
  <!-- 盾形守护外框 -->
  <path d="M20 2c8 0 14 5 14 14 0 9-8 17-14 21-6-4-14-12-14-21C6 7 12 2 20 2z" fill="url(#brandGrad)"/>
  <!-- 内部节点与连线：Node-RED 风格的 flow -->
  <g stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- 节点 1（左上） -->
    <rect x="9" y="13" width="8" height="8" rx="2" fill="rgba(255,255,255,0.18)"/>
    <!-- 节点 2（右中） -->
    <rect x="23" y="10" width="8" height="8" rx="2" fill="rgba(255,255,255,0.18)"/>
    <!-- 节点 3（下中） -->
    <rect x="16" y="23" width="8" height="8" rx="2" fill="rgba(255,255,255,0.18)"/>
    <!-- 连线 + 流向箭头：1 → 2 → 3 -->
    <path d="M17 17 L23 14" fill="none"/>
    <polyline points="21.5 13.2 23 14 22 15.4" fill="none" stroke-width="1.4"/>
    <path d="M27 18 L24 22.5" fill="none"/>
    <polyline points="23.2 21.2 24 22.5 22.4 22.8" fill="none" stroke-width="1.4"/>
  </g>
</svg>
